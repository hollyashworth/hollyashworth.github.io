<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not here</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Libre+Baskerville:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>:root{--paper:#f4ead4;--ink:#2a1d14;--gold:#d9a441;--red:#8e1f1f}
*{box-sizing:border-box} html,body{margin:0;background:#0b0806;color:#f3e7cf;font-family:'Libre Baskerville',Georgia,serif}
body{background:radial-gradient(ellipse at top,#2a1a10 0%,#0b0806 70%) fixed;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:28px 18px 40px}
.kick{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);text-align:center}
h1{font-size:26px;line-height:1.25;text-align:center;margin:8px 0 6px} .sub{text-align:center;font-size:14px;opacity:.85;margin:0 0 18px}
.snow{text-align:center;letter-spacing:10px;color:#e9eef7;opacity:.7;font-size:12px}
.note{background:#1d140d;border:1px solid #d9a44155;border-radius:8px;padding:12px 14px;font-size:13.5px;line-height:1.55;margin:16px 0}
a.room{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--ink);background:var(--paper);border-radius:8px;padding:14px 16px;margin:10px 0;box-shadow:0 6px 20px #000a}
a.room .n{flex:0 0 54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--red);color:#fff;font-weight:700;font-size:20px;border:2px solid #f0c36c}
a.room.p .n{background:#1f3a2c}
a.room b{display:block;font-size:16px} a.room span{display:block;font-size:12.5px;line-height:1.45;opacity:.85} a.room i{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--red);font-style:normal;margin-bottom:2px}
.stars{text-align:center;margin:18px 0 6px;font-size:13px;line-height:1.5} .stars .row{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.stars .row span{width:34px;height:44px;border:1.5px solid #d9a44188;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#4a3a26;background:#1d140d}
.stars .row span.got{color:#f3c24a;border-color:#f3c24a}
.stars .row svg{width:18px;height:18px}
.stars .row small{font-size:8px;letter-spacing:.5px;opacity:.75;color:#f3e7cf;margin-top:2px}
.foot{text-align:center;font-size:11.5px;opacity:.6;margin-top:22px;line-height:1.6}</style>
</head>
<body>
<div class="wrap" style="text-align:center;padding-top:60px">
<div class="kick">Lost in the snow</div>
<h1>This page is not here</h1>
<p class="sub" id="msg">Taking you back to the crime scenes...</p>
<p><a id="home" href="./" style="color:#f6e3a6">Go to the crime scenes</a></p>
</div>
<script>(function(){
  var p = location.pathname, i = p.indexOf('/r/'), root = i >= 0 ? p.slice(0, i + 1) : '/';
  var home = document.getElementById('home'); home.href = root;
  // rooms typed without the r, or in capitals: /r/7, /r/R9, /r9, /R/r8, also when the site lives in a sub folder (/books/r9)
  var m = p.match(/^(.*?\/)(?:r\/r?|r)([0-9])\/?$/i);
  if (m){ location.replace(m[1] + 'r/r' + m[2] + '/' + location.hash); return; }
  // the listening pages and audio files are added separately: never redirect those
  if (/\/(n|audio)\//.test(p)){ document.getElementById('msg').textContent = 'This part is not ready yet. Please try again later.'; return; }
  setTimeout(function(){ location.replace(root); }, 2500);
})();</script>
</body>
</html>
